version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multifonction-ipad
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - app-network

  # Service de développement (optionnel)
  dev:
    image: node:20-alpine
    container_name: multifonction-ipad-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    networks:
      - app-network
    profiles:
      - dev

networks:
  app-network:
    driver: bridge
